name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK (Installable directly on any phone)
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Android Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease -x lint --stacktrace --no-daemon || true

      - name: Prepare APK outputs
        run: |
          mkdir -p output-apks
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} output-apks/ \;
          ls -la output-apks/

      - name: Upload Installable APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Diocres-Hardware-POS-APK
          path: output-apks/*.apk
          if-no-files-found: error
          retention-days: 30
